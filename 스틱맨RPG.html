<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스틱맨RPG</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Malgun Gothic", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #33291f; background: radial-gradient(ellipse at center, #514332 0, #201d1b 75%); }
    .game-shell { width: min(1120px, 98vw); }
    header { display: flex; justify-content: space-between; align-items: end; color: #eee0c3; padding: 10px 4px 12px; }
    h1 { margin: 0; font-size: clamp(20px, 3vw, 30px); letter-spacing: .08em; }
    .subtitle { color: #b9a98d; font-size: 12px; margin-top: 4px; }
    #status { font-size: 12px; color: #dac9aa; text-align: right; }
    .arena { position: relative; overflow: hidden; border: 5px solid #28221c; border-radius: 8px; box-shadow: 0 22px 70px #0009; background: #e7d9b9; }
    canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
    .hud { position: absolute; inset: 0; pointer-events: none; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .top-hud { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
    .panel { background: #211b17db; color: #f4e9d5; border: 1px solid #fff2; border-radius: 7px; padding: 9px 12px; min-width: 190px; box-shadow: 0 2px 8px #0002; }
    .bar { height: 9px; background: #554c40; border-radius: 9px; overflow: hidden; margin-top: 5px; }
    .bar > i { display: block; height: 100%; width: 50%; transition: width .15s; background: #da6254; }
    .xpbar > i { background: #59b8ad; }
    .timer { font-weight: 800; font-size: 20px; text-align: center; }
    .bossbar { display: none; width: min(440px, 55vw); margin: 8px auto 0; }
    .bossbar > i { background: #b34439; }
    .bottom-hud { display: flex; justify-content: space-between; align-items: end; color: #382d21; font-size: 12px; text-shadow: 0 1px #fff9; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: #171410aa; padding: 18px; }
    .overlay.hidden { display: none; }
    .dialog { width: min(680px, 94%); color: #342a20; background: #f0e3c8; border: 3px solid #33291f; border-radius: 10px; padding: 22px; box-shadow: 0 15px 50px #0008; text-align: center; }
    .dialog h2 { margin: 0 0 8px; font-size: 26px; }
    .dialog p { margin: 8px auto 16px; max-width: 550px; line-height: 1.55; }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    button { cursor: pointer; font: inherit; }
    .card, .primary, .secondary { border: 2px solid #493a2b; border-radius: 7px; color: #342a20; background: #fff4dc; }
    .card { min-height: 140px; padding: 14px; text-align: left; transition: transform .12s, background .12s; }
    .card:hover { transform: translateY(-4px); background: white; }
    .card b { display: block; font-size: 17px; margin-bottom: 8px; }
    .card small { color: #685744; line-height: 1.45; }
    .primary, .secondary { padding: 10px 20px; font-weight: 700; margin: 4px; }
    .primary { background: #362b21; color: #f6e7c9; }
    .primary:hover { background: #554331; }
    .secondary { background: transparent; }
    .result-stats { display: flex; justify-content: center; gap: 26px; margin: 18px 0; }
    .result-stats b { display: block; font-size: 22px; }
    .help { padding: 9px 4px; color: #c6b79c; font-size: 12px; }
    @media (max-width: 650px) { .panel { min-width: 135px; padding: 7px 9px; font-size: 12px; } .cards { grid-template-columns: 1fr; } .card { min-height: auto; } .dialog { max-height: 94%; overflow: auto; padding: 16px; } .timer { font-size: 16px; } }
  </style>
</head>
<body>
  <main class="game-shell">
    <header><div><h1>스틱맨 RPG</h1><div class="subtitle">선을 긋고, 잉크의 무리를 돌파하라</div></div><div id="status">전투를 시작할 준비가 됐습니다</div></header>
    <section class="arena">
      <canvas id="game" width="960" height="540" aria-label="스틱맨 RPG 전투 화면"></canvas>
      <div class="hud">
        <div class="top-hud">
          <div class="panel"><div id="hpText">체력 100 / 100</div><div class="bar"><i id="hpBar"></i></div><div id="levelText" style="margin-top:7px">Lv. 1 · 처치 0</div></div>
          <div><div class="panel timer" id="timer">00:00</div><div class="panel bossbar" id="bossBox"><div id="bossText">지우개 거인</div><div class="bar"><i id="bossBar"></i></div></div></div>
          <div class="panel"><div id="xpText">경험치 0 / 5</div><div class="bar xpbar"><i id="xpBar"></i></div><div id="buildText" style="margin-top:7px">연필검 · 대시 베기</div></div>
        </div>
        <div class="bottom-hud"><span>WASD / 방향키 이동 · Space 대시 · Esc 일시정지</span><span id="dashText">대시 준비 완료</span></div>
      </div>
      <div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
    </section>
    <div class="help">팁: 적을 모아 검격으로 정리하고, 위험한 공격은 대시로 관통하세요. 보스 공격 범위는 붉은 선으로 먼저 표시됩니다.</div>
  </main>
<script>
(() => {
  'use strict';
  // 스틱맨 RPG의 단일 화면 게임 규칙과 렌더링을 담당한다.
  const canvas = document.querySelector('#game');
  const ctx = canvas.getContext('2d');
  const $ = (selector) => document.querySelector(selector);
  const W = canvas.width, H = canvas.height;
  const keys = new Set();
  const state = { mode: 'title', elapsed: 0, kills: 0, level: 1, xp: 0, xpNeed: 5, enemies: [], drops: [], particles: [], projectiles: [], slash: 0, spawn: 0, eliteAt: 75, boss: null, last: 0, choices: [], runStart: 0 };
  const player = { x: W / 2, y: H / 2, hp: 100, maxHp: 100, speed: 190, damage: 25, attackRate: 0.72, attack: 0, dash: 0, dashCd: 0, invuln: 0, facing: 1, radius: 13, upgrades: {} };
  const upgrades = [
    { id:'wind', name:'검풍', desc:'검격 범위와 피해가 커집니다.', take(){ player.damage *= 1.22; player.upgrades.wind = (player.upgrades.wind||0)+1; } },
    { id:'spin', name:'회전검', desc:'주변을 도는 선분이 적을 공격합니다.', take(){ player.upgrades.spin = (player.upgrades.spin||0)+1; } },
    { id:'clone', name:'그림자 분신', desc:'대시를 마치면 잔상이 경로를 한 번 더 벱니다.', take(){ player.upgrades.clone = (player.upgrades.clone||0)+1; } },
    { id:'lightning', name:'벼락선', desc:'검격이 가까운 적 하나에게 번집니다.', take(){ player.upgrades.lightning = (player.upgrades.lightning||0)+1; } },
    { id:'ink', name:'잉크 폭발', desc:'적 처치 시 작은 범위 피해를 줍니다.', take(){ player.upgrades.ink = (player.upgrades.ink||0)+1; } },
    { id:'shell', name:'단단한 외곽선', desc:'최대 체력 +25, 체력을 25 회복합니다.', take(){ player.maxHp += 25; player.hp = Math.min(player.maxHp, player.hp+25); } },
    { id:'light', name:'가벼운 획', desc:'이동 속도와 대시 거리가 증가합니다.', take(){ player.speed *= 1.09; player.upgrades.light = (player.upgrades.light||0)+1; } },
    { id:'last', name:'마지막 획', desc:'체력이 절반 이하면 공격력이 35% 증가합니다.', take(){ player.upgrades.last = (player.upgrades.last||0)+1; } },
    { id:'tempo', name:'빠른 손놀림', desc:'검격 간격이 15% 짧아집니다.', take(){ player.attackRate *= .85; } },
    { id:'vital', name:'숨 고르기', desc:'체력을 35 회복합니다.', take(){ player.hp = Math.min(player.maxHp, player.hp+35); } },
    { id:'dash', name:'흐르는 선', desc:'대시 재사용 시간이 20% 감소합니다.', take(){ player.upgrades.dash = (player.upgrades.dash||0)+1; } },
    { id:'magnet', name:'끌어당기는 획', desc:'경험치 구슬을 더 먼 거리에서 끌어옵니다.', take(){ player.upgrades.magnet = (player.upgrades.magnet||0)+1; } }
  ];
  const rand = (a,b) => a + Math.random()*(b-a);
  const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
  const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
  const fmt = (s) => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(Math.floor(s%60)).padStart(2,'0')}`;

  function panel(title, body, buttons='') { $('#dialog').innerHTML = `<h2>${title}</h2>${body}${buttons}`; $('#overlay').classList.remove('hidden'); }
  function hidePanel() { $('#overlay').classList.add('hidden'); }
  function showTitle() {
    state.mode = 'title';
    panel('스틱맨 RPG', '<p>스케치북 세계를 잠식하는 잉크 괴물과 맞서세요.<br>적을 베고 경험치를 모아 12분 뒤의 지우개 거인을 쓰러뜨리세요.</p><p><b>WASD / 방향키</b> 이동 · <b>Space</b> 대시와 베기 · <b>Esc</b> 일시정지</p>', '<button class="primary" id="startBtn">전투 시작</button>');
    $('#startBtn').onclick = startRun;
  }
  function resetRun() {
    Object.assign(state, { elapsed:0,kills:0,level:1,xp:0,xpNeed:5,enemies:[],drops:[],particles:[],projectiles:[],slash:0,spawn:0,eliteAt:75,boss:null,choices:[] });
    Object.assign(player, { x:W/2,y:H/2,hp:100,maxHp:100,speed:190,damage:25,attackRate:.72,attack:0,dash:0,dashCd:0,invuln:0,facing:1,upgrades:{} });
  }
  function startRun() { resetRun(); state.mode='playing'; state.runStart=performance.now(); state.last=state.runStart; hidePanel(); $('#status').textContent='잉크의 무리가 다가옵니다'; }
  function chooseUpgrade(item) {
    item.take(); state.level++; state.xp -= state.xpNeed; state.xpNeed = Math.floor(state.xpNeed*1.42+3); state.mode='playing'; hidePanel(); updateHud();
    if (state.xp >= state.xpNeed) levelUp();
  }
  function levelUp() {
    state.mode='levelup';
    const pool = upgrades.filter(u => u.id !== 'spin' || (player.upgrades.spin||0)<5).filter(u => u.id !== 'clone' || (player.upgrades.clone||0)<4);
    state.choices = [...pool].sort(()=>Math.random()-.5).slice(0,3);
    const cards = state.choices.map((u,i)=>`<button class="card" data-choice="${i}"><b>${u.name}</b><small>${u.desc}</small></button>`).join('');
    panel(`레벨 ${state.level} 달성!`, '<p>다음 전투 스타일을 선택하세요.</p>', `<div class="cards">${cards}</div>`);
    document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>chooseUpgrade(state.choices[Number(b.dataset.choice)]));
  }
  function spawnEnemy(type='chaser') {
    const angle=rand(0,Math.PI*2), d=rand(390,520), x=clamp(player.x+Math.cos(angle)*d,22,W-22), y=clamp(player.y+Math.sin(angle)*d,22,H-22);
    const scale=1+Math.min(.8,state.elapsed/500);
    const defs={chaser:{hp:40*scale,speed:48+state.elapsed*.035,damage:9,r:13,xp:1,color:'#33302b'},charger:{hp:68*scale,speed:37+state.elapsed*.025,damage:15,r:15,xp:2,color:'#704d37'},thrower:{hp:52*scale,speed:30,damage:8,r:14,xp:2,color:'#526e68'},elite:{hp:330*scale,speed:34,damage:20,r:23,xp:10,color:'#a74235'}};
    const dfn=defs[type]; state.enemies.push({x,y,type,...dfn,maxHp:dfn.hp,attack:rand(1,2),windup:0,charge:0,flash:0,seed:Math.random()*10});
  }
  function spawnBoss() {
    state.boss={x:W/2,y:90,hp:1800,maxHp:1800,r:35,attack:2.2,phase:0,warning:0,aimY:0};
    $('#bossBox').style.display='block'; $('#status').textContent='지우개 거인 출현!';
  }
  function attack() {
    const targets=state.enemies.filter(e=>dist(e,player)<185).sort((a,b)=>dist(a,player)-dist(b,player));
    if(state.boss && dist(state.boss,player)<205) targets.push(state.boss);
    if(!targets.length)return;
    const target=targets[0]; player.facing=target.x>=player.x?1:-1;
    const damage=player.damage*((player.upgrades.last&&player.hp<player.maxHp*.5)?1.35:1);
    state.slash=.18;
    damageEnemy(target,damage,'slash');
    if(player.upgrades.lightning) { const second=state.enemies.filter(e=>e!==target&&dist(e,target)<125).sort((a,b)=>dist(a,target)-dist(b,target))[0]; if(second){line(target.x,target.y,second.x,second.y,'#63c8d0',4);damageEnemy(second,damage*.55,'lightning');} }
  }
  function damageEnemy(enemy, amount, source) {
    enemy.hp-=amount; enemy.flash=.12; burst(enemy.x,enemy.y,source==='lightning'?'#66c8cb':'#302c27',5);
    if(enemy.hp<=0) killEnemy(enemy);
  }
  function killEnemy(enemy) {
    const i=state.enemies.indexOf(enemy); if(i<0)return;
    state.enemies.splice(i,1); state.kills++; burst(enemy.x,enemy.y,'#24211d',12);
    state.drops.push({x:enemy.x,y:enemy.y,r:5,xp:enemy.xp,life:32});
    if(player.upgrades.ink){for(const other of [...state.enemies])if(dist(other,enemy)<72)damageEnemy(other,24*player.upgrades.ink,'ink');burst(enemy.x,enemy.y,'#b65043',14);}
  }
  function burst(x,y,color,n) { for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(25,130);state.particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.18,.5),color,r:rand(1.5,4)});} }
  function line(x1,y1,x2,y2,color,width=3) { ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke(); }
  function dash() {
    if(player.dashCd>0||state.mode!=='playing')return;
    let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0), dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);
    if(!dx&&!dy)dx=player.facing; const length=Math.hypot(dx,dy)||1; dx/=length;dy/=length;
    const x1=player.x,y1=player.y, d=118+(player.upgrades.light||0)*13;
    player.x=clamp(player.x+dx*d,20,W-20);player.y=clamp(player.y+dy*d,22,H-22);player.invuln=.48;player.dash=.2;player.dashCd=Math.max(.85,2.5*Math.pow(.8,player.upgrades.dash||0));
    line(x1,y1,player.x,player.y,'#69c5bd',8);burst(player.x,player.y,'#69c5bd',7);
    for(const e of [...state.enemies])if(segmentDistance(e.x,e.y,x1,y1,player.x,player.y)<e.r+13)damageEnemy(e,player.damage*1.35,'dash');
    if(state.boss&&segmentDistance(state.boss.x,state.boss.y,x1,y1,player.x,player.y)<state.boss.r+12)damageBoss(player.damage*1.35);
    if(player.upgrades.clone)line(x1,y1,player.x,player.y,'#aa82ba',3);
  }
  function segmentDistance(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,t=clamp(((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1),0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));}
  function damageBoss(amount){if(!state.boss)return;state.boss.hp-=amount;burst(state.boss.x,state.boss.y,'#a74235',4);if(state.boss.hp<=0){state.boss=null;finish(true);}}
  function hurt(amount){if(player.invuln>0||state.mode!=='playing')return;player.hp-=Math.max(1,amount);player.invuln=.7;burst(player.x,player.y,'#bd4e40',9);if(player.hp<=0){player.hp=0;finish(false);}}
  function finish(won){state.mode='result';$('#bossBox').style.display='none';$('#status').textContent=won?'잉크 거인을 쓰러뜨렸습니다':'스케치가 지워졌습니다';const body=`<p>${won?'전장을 지켜냈습니다!':'다시 선을 그을 시간이 왔습니다.'}</p><div class="result-stats"><div><b>${fmt(state.elapsed)}</b>생존 시간</div><div><b>${state.kills}</b>처치</div><div><b>${state.level}</b>도달 레벨</div></div><p>이번 전투에서 만든 빌드: ${buildNames()}</p>`;panel(won?'승리':'패배',body,'<button class="primary" id="againBtn">다시 도전</button>');$('#againBtn').onclick=startRun;}
  function buildNames(){const names=upgrades.filter(u=>player.upgrades[u.id]).map(u=>u.name);return ['연필검',...names,'대시 베기'].join(' · ');}
  function update(dt){
    if(state.mode!=='playing')return;
    state.elapsed+=dt;player.attack-=dt;player.dashCd=Math.max(0,player.dashCd-dt);player.dash=Math.max(0,player.dash-dt);player.invuln=Math.max(0,player.invuln-dt);state.slash=Math.max(0,state.slash-dt);
    let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0),m=Math.hypot(dx,dy)||1;
    if(dx||dy){player.x=clamp(player.x+dx/m*player.speed*dt,18,W-18);player.y=clamp(player.y+dy/m*player.speed*dt,20,H-20);if(dx)player.facing=Math.sign(dx);}
    if(player.attack<=0){attack();player.attack=player.attackRate;}
    if(state.elapsed<720){state.spawn-=dt;if(state.spawn<=0){const count=state.elapsed<120?1:Math.random()<Math.min(.62,.2+state.elapsed/900)?2:1;for(let i=0;i<count;i++){const r=Math.random();spawnEnemy(state.elapsed>80&&r<.08?'thrower':state.elapsed>35&&r<.24?'charger':'chaser');}state.spawn=Math.max(.28,1.15-state.elapsed/1000);}}
    if(state.elapsed>=state.eliteAt&&state.elapsed<720){spawnEnemy('elite');state.eliteAt+=115;}
    if(state.elapsed>=720&&!state.boss)spawnBoss();
    for(const e of [...state.enemies]){
      e.attack-=dt;e.flash=Math.max(0,e.flash-dt);
      if(e.type==='charger'){
        if(e.charge>0){e.charge-=dt;e.x+=e.vx*dt;e.y+=e.vy*dt;}
        else if(e.windup>0){e.windup-=dt;if(e.windup<=0){const d=dist(e,player)||1;e.vx=(player.x-e.x)/d*250;e.vy=(player.y-e.y)/d*250;e.charge=.45;}}
        else if(dist(e,player)<260&&e.attack<=0){e.windup=.62;e.attack=2.6;}
        else moveToPlayer(e,dt,e.speed*.72);
      } else if(e.type==='thrower'){
        const d=dist(e,player);if(d>245)moveToPlayer(e,dt,e.speed);else if(d<175){e.x+=(e.x-player.x)/(d||1)*e.speed*dt;e.y+=(e.y-player.y)/(d||1)*e.speed*dt;}
        if(e.attack<=0&&d<360){const n=d||1;state.projectiles.push({x:e.x,y:e.y,vx:(player.x-e.x)/n*145,vy:(player.y-e.y)/n*145,life:3,damage:e.damage});e.attack=2.2;}
      } else moveToPlayer(e,dt,e.speed);
      if(dist(e,player)<e.r+player.radius)hurt(e.damage*dt*2.2);
      if(player.upgrades.spin&&Math.sin(state.elapsed*5+e.seed)>0.93&&dist(e,player)<54)damageEnemy(e,player.upgrades.spin*9*dt,'spin');
    }
    for(const p of state.projectiles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(Math.hypot(p.x-player.x,p.y-player.y)<player.radius+7){hurt(p.damage);p.life=0;}}
    state.projectiles=state.projectiles.filter(p=>p.life>0);
    for(const drop of [...state.drops]){drop.life-=dt;let d=dist(drop,player),magnet=player.upgrades.magnet?210:105;if(d<magnet){drop.x+=(player.x-drop.x)/(d||1)*Math.min(430,d*3)*dt;drop.y+=(player.y-drop.y)/(d||1)*Math.min(430,d*3)*dt;}if(d<22){state.xp+=drop.xp;state.drops.splice(state.drops.indexOf(drop),1);while(state.xp>=state.xpNeed&&state.mode==='playing')levelUp();}else if(drop.life<=0)state.drops.splice(state.drops.indexOf(drop),1);}
    for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}state.particles=state.particles.filter(p=>p.life>0);
    if(state.boss)updateBoss(dt);
    updateHud();
  }
  function moveToPlayer(e,dt,speed){const d=dist(e,player)||1;e.x+=(player.x-e.x)/d*speed*dt;e.y+=(player.y-e.y)/d*speed*dt;}
  function updateBoss(dt){const b=state.boss;b.attack-=dt;if(b.warning>0){b.warning-=dt;if(b.warning<=0){if(b.phase===1){const y=b.aimY;line(35,y,W-35,y,'#c54236',22);if(Math.abs(player.y-y)<42)hurt(35);b.y=clamp(b.y+rand(-85,85),65,H-70);}else{const d=Math.hypot(player.x-b.x,player.y-b.y);if(d<100)hurt(30);burst(b.x,b.y,'#ad4a3e',20);}b.attack=2.1;}return;}if(b.attack<=0){b.phase=Math.random()<.55?1:2;b.aimY=clamp(player.y,60,H-60);b.warning=.9;}else{const d=dist(b,player);if(d>155)moveToPlayer(b,dt,28);}}
  function updateHud(){ $('#hpText').textContent=`체력 ${Math.ceil(player.hp)} / ${player.maxHp}`;$('#hpBar').style.width=`${100*player.hp/player.maxHp}%`;$('#levelText').textContent=`Lv. ${state.level} · 처치 ${state.kills}`;$('#xpText').textContent=`경험치 ${state.xp} / ${state.xpNeed}`;$('#xpBar').style.width=`${100*state.xp/state.xpNeed}%`;$('#timer').textContent=fmt(state.elapsed);$('#dashText').textContent=player.dashCd>0?`대시 ${player.dashCd.toFixed(1)}초`:'대시 준비 완료';$('#buildText').textContent=buildNames();if(state.boss){$('#bossText').textContent=`지우개 거인 · ${Math.ceil(state.boss.hp)} HP`;$('#bossBar').style.width=`${100*state.boss.hp/state.boss.maxHp}%`;}}
  function draw(){drawPaper();for(const d of state.drops)drawDrop(d);for(const p of state.projectiles)drawProjectile(p);for(const e of state.enemies)drawEnemy(e);if(state.boss)drawBoss(state.boss);for(const p of state.particles){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;drawPlayer();if(state.mode==='title')drawTitleArt();}
  function drawPaper(){ctx.fillStyle='#e8dbbd';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#d5c7a7';ctx.lineWidth=1;for(let y=26;y<H;y+=34){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}ctx.strokeStyle='#d5b8a8';ctx.beginPath();ctx.moveTo(58,0);ctx.lineTo(58,H);ctx.stroke();for(let i=0;i<90;i++){const x=(i*149)%W,y=(i*83)%H;ctx.fillStyle='#8a765222';ctx.fillRect(x,y,1,1);}}
  function stick(x,y,scale,color,pose='idle'){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.strokeStyle=color;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.arc(0,-22,7,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(0,9);ctx.moveTo(0,-7);ctx.lineTo(pose==='attack'?16:-10,-1);ctx.moveTo(0,-7);ctx.lineTo(pose==='attack'?-13:10,1);ctx.moveTo(0,9);ctx.lineTo(-9,23);ctx.moveTo(0,9);ctx.lineTo(10,23);ctx.stroke();ctx.restore();}
  function drawPlayer(){const c=player.invuln>0&&Math.floor(state.elapsed*20)%2?'#a8493c':'#272520';stick(player.x,player.y,1.15,c,state.slash>0?'attack':'idle');if(state.slash>0){ctx.strokeStyle='#36312b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(player.x+player.facing*12,player.y-8,38,-.8,.8);ctx.stroke();}if(player.upgrades.spin){for(let i=0;i<player.upgrades.spin;i++){const a=state.elapsed*3+i*Math.PI*2/player.upgrades.spin;line(player.x+Math.cos(a)*35,player.y+Math.sin(a)*35,player.x+Math.cos(a)*48,player.y+Math.sin(a)*48,'#494239',4);}}}
  function drawEnemy(e){if(e.type==='elite'){ctx.fillStyle='#a74235';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();stick(e.x,e.y,1.5,e.flash?'#fff0d5':'#632d28','idle');ctx.fillStyle='#2e2520';ctx.fillRect(e.x-23,e.y-39,46,4);ctx.fillStyle='#db7560';ctx.fillRect(e.x-23,e.y-39,46*e.hp/e.maxHp,4);return;}stick(e.x,e.y,e.type==='charger'?1.05:.9,e.flash?'#fff4dd':e.color,e.type==='charger'&&e.windup>0?'attack':'idle');if(e.type==='charger'&&e.windup>0){ctx.strokeStyle='#d45a46';ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+9,0,Math.PI*2);ctx.stroke();}if(e.type==='thrower'){ctx.fillStyle='#47786e';ctx.beginPath();ctx.arc(e.x,e.y-22,4,0,Math.PI*2);ctx.fill();}}
  function drawDrop(d){ctx.fillStyle='#51aaa3';ctx.beginPath();ctx.moveTo(d.x,d.y-d.r);ctx.lineTo(d.x+d.r,d.y);ctx.lineTo(d.x,d.y+d.r);ctx.lineTo(d.x-d.r,d.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#d6f3df';ctx.stroke();}
  function drawProjectile(p){ctx.fillStyle='#71938b';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f0e4c9';ctx.stroke();}
  function drawBoss(b){if(b.warning>0){ctx.strokeStyle='#bd4036';ctx.lineWidth=18;ctx.globalAlpha=.36+.28*Math.sin(state.elapsed*25);ctx.beginPath();if(b.phase===1){ctx.moveTo(30,b.aimY);ctx.lineTo(W-30,b.aimY);}else{ctx.arc(player.x,player.y,53,0,Math.PI*2);}ctx.stroke();ctx.globalAlpha=1;}ctx.fillStyle='#4a332d';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();stick(b.x,b.y,2.35,'#302722','idle');ctx.strokeStyle='#f3e4c5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r+6,0,Math.PI*2);ctx.stroke();}
  function drawTitleArt(){stick(W/2,H/2+12,2.3,'#312c25','idle');ctx.strokeStyle='#4a3a2c';ctx.lineWidth=4;ctx.beginPath();ctx.arc(W/2+55,H/2-14,65,-1.2,.7);ctx.stroke();}
  function frame(now){const dt=Math.min(.04,(now-state.last)/1000||0);state.last=now;update(dt);draw();requestAnimationFrame(frame);}
  document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys.add(k);if(k===' '){if(state.mode==='title')startRun();else dash();}if(k==='escape'){if(state.mode==='playing'){state.mode='pause';panel('일시 정지','<p>잠시 숨을 고르세요.</p>','<button class="primary" id="resumeBtn">계속하기</button><button class="secondary" id="quitBtn">전투 포기</button>');$('#resumeBtn').onclick=()=>{state.mode='playing';state.last=performance.now();hidePanel();};$('#quitBtn').onclick=()=>finish(false);}else if(state.mode==='pause'){state.mode='playing';state.last=performance.now();hidePanel();}}});
  document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
  showTitle();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
